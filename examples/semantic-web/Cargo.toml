[package]
name = "glory-semantic-web"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glory = { path = "../../crates/glory", features = ["web", "ssr", "hydrate", "resources", "stream", "css"] }
glory-render = { path = "../../crates/render", features = ["conformance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.123"
js-sys = "=0.3.100"
web-sys = { version = "=0.3.100", features = ["Window", "Document", "Element"] }

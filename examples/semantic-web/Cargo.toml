[package]
name = "glory-semantic-web"
version = "0.6.1"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[workspace]

resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glory = { path = "../../crates/glory", features = ["web", "ssr", "hydrate", "resources", "stream", "css"] }
glory-render = { path = "../../crates/render", features = ["conformance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element"] }

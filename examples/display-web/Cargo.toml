[package]
name = "display-web"
version = "0.0.0"
edition = "2024"
publish = false

[features]
hand = []

[dependencies]
g = { package = "glory", path = "../../crates/glory", default-features = false, features = ["dsl", "ssr", "hydrate", "stream"] }
futures-core = "0.3.34"
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element"] }
sapid = { path = "../../../sapid" }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

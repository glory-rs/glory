[package]
name = "display-web"
version = "0.0.0"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[features]
hand = []

[dependencies]
g = { package = "glory", path = "../../crates/glory", default-features = false, features = ["dsl", "ssr", "hydrate", "stream"] }
futures-core = "0.3.34"
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element"] }
sapid = { path = "../../../sapid" }

[workspace]

resolver = "3"
[profile.release]
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1

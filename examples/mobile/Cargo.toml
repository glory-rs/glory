[package]
name = "glory-mobile-counter"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "counter-ios"
path = "src/ios.rs"

[dependencies]
counter = { path = "../counter" }
glory = { path = "../../crates/glory", features = ["blitz-shell", "blitz-package"] }

[lints.rust]
unsafe_code = "deny"

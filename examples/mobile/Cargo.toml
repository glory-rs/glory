[package]
name = "glory-mobile-counter"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "counter-ios"
path = "src/ios.rs"

[features]
default = ["android-native-activity"]
android-native-activity = ["glory/blitz-android-native-activity"]
android-game-activity = ["glory/blitz-android-game-activity"]
android-assets = ["glory/blitz-android-assets"]
android-assets-probe = ["android-assets"]
network = ["glory/blitz-network", "dep:jni"]
network-probe = ["network"]
permissions = ["glory/blitz-permissions", "dep:jni"]
permissions-probe = ["permissions", "dep:futures-timer"]
permissions-host-probe = ["permissions"]
ios-io-probe = ["clipboard", "files"]
ios-files-ui-probe = ["files"]
files = ["glory/blitz-files", "dep:jni", "dep:futures-timer"]
files-probe = ["files", "dep:futures-timer"]
files-ui-probe = ["files"]
clipboard = ["glory/blitz-clipboard", "dep:jni", "dep:futures-timer"]
clipboard-probe = ["clipboard", "dep:futures-timer"]
ime-probe = []
keyboard-probe = []
controls-probe = []
radio-probe = []
placeholder-probe = []
choice-probe = []
select-probe = []
menu-probe = []
tags-probe = []

[dependencies]
futures-timer = { version = "=3.0.3", optional = true }
counter = { path = "../counter" }
glory = { path = "../../crates/glory", features = ["blitz-shell", "blitz-package"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false, optional = true }


[lints.rust]
unsafe_code = "deny"

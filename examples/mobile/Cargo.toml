[package]
name = "glory-mobile-counter"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "counter-ios"
path = "src/ios.rs"

[features]
default = ["android-native-activity"]
android-native-activity = ["glory/apace-android-native-activity"]
android-game-activity = ["glory/apace-android-game-activity"]
android-assets = ["glory/apace-android-assets"]
android-assets-probe = ["android-assets"]
network = ["glory/apace-network", "dep:jni"]
network-probe = ["network"]
permissions = ["glory/apace-permissions", "dep:jni"]
permissions-probe = ["permissions", "dep:futures-timer"]
permissions-host-probe = ["permissions"]
files = ["glory/apace-files", "dep:jni"]
files-probe = ["files", "dep:futures-timer"]
clipboard = ["glory/apace-clipboard", "dep:jni"]
clipboard-probe = ["clipboard", "dep:futures-timer"]
ime-probe = []
keyboard-probe = []
controls-probe = []
radio-probe = []
placeholder-probe = []
choice-probe = []
select-probe = []
menu-probe = []
tags-probe = []

[dependencies]
counter = { path = "../counter" }
glory = { path = "../../crates/glory", features = ["apace-shell", "apace-package"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false, optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
futures-timer = { version = "=3.0.4", optional = true }

[lints.rust]
unsafe_code = "deny"

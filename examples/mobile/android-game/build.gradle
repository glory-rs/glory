plugins { id 'com.android.application' version '9.0.0' }

def output = System.getenv('GLORY_ANDROID_GRADLE_OUTPUT')
def nativeLibraries = System.getenv('GLORY_ANDROID_LIBS')
def debugKey = System.getenv('GLORY_ANDROID_DEBUG_KEY')
def generatedManifest = System.getenv('GLORY_ANDROID_MANIFEST')
def tlsVersion = System.getenv('GLORY_ANDROID_TLS_VERSION')
if (!output || !nativeLibraries || !debugKey || !generatedManifest) {
    throw new GradleException('Use build-android-game.sh with explicit data-volume outputs')
}
layout.buildDirectory = file(output)
def prepareGloryAssets = tasks.register('prepareGloryAssets', Sync) {
    from file('../assets')
    into layout.buildDirectory.dir('glory-assets/glory')
    doLast {
        if ((System.getenv('GLORY_ANDROID_FEATURES') ?: '').tokenize(', ').contains('android-assets-probe')) {
            def nested = layout.buildDirectory.file('glory-assets/glory/中文/组合.txt').get().asFile
            nested.parentFile.mkdirs()
            nested.setText('中文😀 asset probe', 'UTF-8')
        }
    }
    inputs.property('assetProbe', (System.getenv('GLORY_ANDROID_FEATURES') ?: '').tokenize(', ').contains('android-assets-probe'))
}
android {
    namespace 'rs.glory.counter'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'rs.glory.counter'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug {
            storeFile file(debugKey)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets.main.jniLibs.srcDirs = [nativeLibraries]
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('glory-assets')]
    sourceSets.main.manifest.srcFile generatedManifest
    // android-activity compiles its matching 4.4.0 C++ glue; do not link the AAR's.
    buildFeatures { prefab false }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.named('preBuild').configure { dependsOn prepareGloryAssets }
dependencies {
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    if (tlsVersion) {
        implementation "org.rustls:rustls-platform-verifier:${tlsVersion}"
    }
}
dependencyLocking {
    lockAllConfigurations()
    lockFile = file(tlsVersion ? 'gradle-network.lockfile' : 'gradle.lockfile')
}

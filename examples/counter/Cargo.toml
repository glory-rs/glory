[package]
name = "counter"
version = "0.0.1"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[workspace]
resolver = "3"
members = ["tools/glory"]
default-members = ["."]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
web = ["glory/web", "dep:wasm-bindgen", "dep:web-sys"]
desktop = ["glory/apace-accesskit"]

[[bin]]
name = "counter-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
glory = { path = "../../crates/glory", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
web-sys = { version = "=0.3.107", optional = true, features = ["Window", "Document", "Element"] }

[package]
repository.workspace = true
name = "glory-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser DOM and frame host for Glory semantic UI"

[features]
default = []
routing = ["dep:glory-routing", "web-sys/History", "web-sys/Location", "web-sys/ScrollRestoration", "web-sys/Crypto", "web-sys/HtmlAnchorElement"]
hydrate = []
resources = ["dep:glory-resource"]
stream = ["resources", "hydrate"]

[dependencies]
glory-routing = { path = "../routing", version = "0.6.1", optional = true }
glory-core = { path = "../core", version = "0.6.1" }
glory-ui = { path = "../ui", version = "0.6.1" }
glory-html = { path = "../html", version = "0.6.1" }
glory-render = { path = "../render", version = "0.6.1" }
glory-resource = { path = "../resource", version = "0.6.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
web-sys = { version = "=0.3.107", features = ["Window", "VisualViewport", "Document", "Node", "Element", "DomTokenList", "HtmlElement", "HtmlImageElement", "SvgElement", "HtmlInputElement", "File", "FileList", "Blob", "DragEvent", "DataTransfer", "Url", "HtmlTextAreaElement", "DocumentFragment", "Comment", "Text", "Event", "EventTarget", "AddEventListenerOptions", "SubmitEvent", "InputEvent", "KeyboardEvent", "MediaQueryList", "MediaQueryListEvent", "PointerEvent", "MouseEvent", "FocusEvent", "FocusOptions", "CompositionEvent", "ClipboardEvent", "Selection", "DomRect", "Range", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverBoxOptions", "CssStyleDeclaration", "Performance", "console"] }

[lints]
workspace = true


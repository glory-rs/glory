[package]
name = "glory-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser DOM and frame host for Glory semantic UI"

[features]
default = []
hydrate = []
resources = ["dep:glory-resource"]
stream = ["resources", "hydrate"]

[dependencies]
glory-core = { path = "../core", version = "0.3.1" }
glory-ui = { path = "../ui", version = "0.3.1" }
glory-html = { path = "../html", version = "0.3.1" }
glory-render = { path = "../render", version = "0.3.1" }
glory-resource = { path = "../resource", version = "0.3.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
web-sys = { version = "=0.3.106", features = ["Window", "VisualViewport", "Document", "Node", "Element", "HtmlElement", "HtmlImageElement", "SvgElement", "HtmlInputElement", "HtmlTextAreaElement", "DocumentFragment", "Comment", "Text", "Event", "EventTarget", "AddEventListenerOptions", "SubmitEvent", "InputEvent", "KeyboardEvent", "MediaQueryList", "MediaQueryListEvent", "PointerEvent", "MouseEvent", "FocusEvent", "FocusOptions", "CompositionEvent", "DomRect", "Range", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverBoxOptions", "CssStyleDeclaration", "Performance", "console"] }

[lints]
workspace = true


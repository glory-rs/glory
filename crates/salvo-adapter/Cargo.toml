[package]
name = "glory-salvo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Salvo HTTP responses for Glory semantic SSR"
repository.workspace = true
readme = "README.md"

[features]
default = []
css = ["glory-ssr/css"]
resources = ["glory-ssr/resources"]
stream = ["resources", "glory-ssr/stream", "dep:futures-core", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-ssr = { path = "../ssr", version = "0.3.1" }
glory-ui = { path = "../ui", version = "0.3.1" }
salvo = { version = "1.0.1", default-features = false }
futures-core = { version = "0.3.34", optional = true }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glory = { path = "../glory", features = ["ssr", "stream", "css"] }
glory-web = { path = "../web", features = ["stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.3"
salvo = { version = "1.0.1", default-features = false, features = ["server", "http1", "test", "server-handle"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[[example]]
name = "ssr"
required-features = ["stream"]

[lints]
workspace = true

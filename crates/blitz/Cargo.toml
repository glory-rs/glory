[package]
name = "glory-blitz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Incremental Blitz document host for Glory semantic UI"

[features]
default = []
css = ["glory-html/css"]
assets = ["dep:reqwest", "dep:tokio", "dep:rustls", "dep:rustls-platform-verifier", "dep:cap-std", "dep:cap-fs-ext", "dep:percent-encoding"]
paint = ["dep:blitz-paint", "dep:anyrender"]
raster = ["paint", "dep:anyrender_vello_cpu"]
shell = ["paint", "dep:glory-core", "dep:glory-ui", "dep:blitz-shell", "dep:winit", "dep:keyboard-types", "dep:anyrender_vello_cpu", "dep:softbuffer_window_renderer"]
accesskit = ["shell", "dep:accesskit", "dep:accesskit_xplat"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-html = { path = "../html", version = "0.3.1" }
glory-render = { path = "../render", version = "0.3.1" }
glory-core = { path = "../core", version = "0.3.1", optional = true }
glory-ui = { path = "../ui", version = "0.3.1", optional = true }
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "b40cdfc2c9b5a000759275b673e4ed8aadd68f78", version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "complex-scripts"] }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "b40cdfc2c9b5a000759275b673e4ed8aadd68f78", version = "=0.3.0-beta.4", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
# Typed visibility returned by Blitz's public computed-style API. Keep this
# engine detail inside the adapter; glory-style remains the portable value crate.
style = { package = "stylo", version = "=0.22.0", default-features = false }
blitz-paint = { git = "https://github.com/glory-rs/blitz", rev = "b40cdfc2c9b5a000759275b673e4ed8aadd68f78", version = "=0.3.0-beta.4", default-features = false, optional = true }
anyrender = { version = "=0.14.0", optional = true }
anyrender_vello_cpu = { version = "=0.18.0", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
accesskit = { version = "=0.25.0", optional = true }
accesskit_xplat = { version = "=0.2.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
cap-std = { version = "=4.0.3", optional = true }
cap-fs-ext = { version = "=4.0.3", optional = true }
percent-encoding = { version = "2.3", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros"], optional = true }
blitz-shell = { git = "https://github.com/glory-rs/blitz", rev = "b40cdfc2c9b5a000759275b673e4ed8aadd68f78", version = "=0.3.0-beta.4", default-features = false, optional = true }
winit = { version = "=0.31.0-beta.3", optional = true }
keyboard-types = { version = "0.8", optional = true }
softbuffer_window_renderer = { version = "=0.9.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Resolve system fonts through runtime-loaded Fontconfig. Cross-checking from
# Windows must not probe the host for a target-platform pkg-config installation.
fontique = { version = "=0.12.0", default-features = false, features = ["fontconfig-dlopen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glory-render = { path = "../render", version = "0.3.1", features = ["conformance"] }
glory-ui = { path = "../ui", version = "0.3.1" }
png = "0.18"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dev-dependencies]
accesskit_consumer = "=0.39.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[[example]]
name = "raster"
required-features = ["raster"]

[[example]]
name = "profile"
required-features = ["raster"]

[[example]]
name = "window"
required-features = ["shell"]

[[example]]
name = "assets"
required-features = ["assets", "shell"]

[lints]
workspace = true

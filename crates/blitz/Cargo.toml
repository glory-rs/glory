[package]
name = "glory-blitz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Incremental Blitz document host for Glory semantic UI"

[features]
default = []
css = ["glory-html/css"]
package = ["dep:tokio"]
network = ["package", "tokio/net", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:jni"]
assets = ["network", "dep:cap-std", "dep:cap-fs-ext", "dep:percent-encoding"]
android-assets = ["package", "dep:ndk", "dep:percent-encoding"]
permissions = ["dep:futures-timer", "dep:jni"]
paint = ["dep:blitz-paint", "dep:anyrender", "dep:kurbo", "dep:peniko", "blitz-dom/custom-widget", "blitz-paint/custom-widget"]
raster = ["paint", "dep:anyrender_vello_cpu"]
shell = ["paint", "dep:glory-core", "dep:glory-ui", "dep:blitz-shell", "dep:winit", "dep:keyboard-types", "dep:anyrender_vello_cpu", "dep:softbuffer_window_renderer"]
android-native-activity = ["shell", "winit/android-native-activity"]
android-game-activity = ["shell", "winit/android-game-activity", "blitz-shell/android-game-activity"]
accesskit = ["shell", "dep:accesskit", "dep:accesskit_xplat"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-html = { path = "../html", version = "0.3.1" }
glory-render = { path = "../render", version = "0.3.1" }
glory-core = { path = "../core", version = "0.3.1", optional = true }
glory-ui = { path = "../ui", version = "0.3.1", optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"], optional = true }
futures-timer = { version = "=3.0.3", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
blitz-dom = { git = "https://github.com/glory-rs/blitz", rev = "6d52bb22da982422716db7d75b434778811ba5cf", version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "complex-scripts"] }
blitz-traits = { git = "https://github.com/glory-rs/blitz", rev = "6d52bb22da982422716db7d75b434778811ba5cf", version = "=0.3.0-beta.4", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Typed visibility returned by Blitz's public computed-style API. Keep this
# engine detail inside the adapter; glory-style remains the portable value crate.
style = { package = "stylo", version = "=0.22.0", default-features = false }
blitz-paint = { git = "https://github.com/glory-rs/blitz", rev = "6d52bb22da982422716db7d75b434778811ba5cf", version = "=0.3.0-beta.4", default-features = false, optional = true }
anyrender = { version = "=0.14.0", optional = true }
kurbo = { version = "=0.13.1", optional = true }
peniko = { version = "=0.6.1", optional = true }
anyrender_vello_cpu = { version = "=0.18.0", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
accesskit = { version = "=0.25.1", optional = true }
accesskit_xplat = { version = "=0.2.1", optional = true }
cap-std = { version = "=4.0.3", optional = true }
cap-fs-ext = { version = "=4.0.3", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "=0.9.0", default-features = false, optional = true }
jni = { version = "=0.22.4", default-features = false, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos", target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
blitz-shell = { git = "https://github.com/glory-rs/blitz", rev = "6d52bb22da982422716db7d75b434778811ba5cf", version = "=0.3.0-beta.4", default-features = false, optional = true }
winit = { git = "https://github.com/glory-rs/winit", rev = "3b6f5a09697acb936567af64e53c915b0b1a2af9", version = "=0.31.0-beta.4", optional = true }
keyboard-types = { version = "0.8.3", optional = true }
softbuffer_window_renderer = { version = "=0.9.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Resolve system fonts through runtime-loaded Fontconfig. Cross-checking from
# Windows must not probe the host for a target-platform pkg-config installation.
fontique = { version = "=0.12.0", default-features = false, features = ["fontconfig-dlopen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glory-render = { path = "../render", version = "0.3.1", features = ["conformance"] }
glory-ui = { path = "../ui", version = "0.3.1" }
png = "0.18.1"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dev-dependencies]
accesskit_consumer = "=0.39.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[[example]]
name = "raster"
required-features = ["raster"]

[[example]]
name = "profile"
required-features = ["raster"]

[[example]]
name = "window"
required-features = ["shell"]

[[example]]
name = "assets"
required-features = ["assets", "shell"]

[lints]
workspace = true


[[test]]
name = "macos_window"
path = "tests/macos_window.rs"
harness = false
required-features = ["shell"]

[package]
name = "glory-ssr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTML snapshot rendering for Glory semantic UI"

[features]
default = []
css = ["glory-html/css"]
resources = ["dep:glory-resource"]
stream = ["resources", "glory-html/wire", "dep:futures-core", "dep:futures-util", "dep:serde_json"]

[dependencies]
glory-core = { path = "../core", version = "0.3.1" }
glory-ui = { path = "../ui", version = "0.3.1" }
glory-render = { path = "../render", version = "0.3.1" }
glory-html = { path = "../html", version = "0.3.1" }
glory-resource = { path = "../resource", version = "0.3.1", optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
glory-render = { path = "../render", version = "0.3.1", features = ["conformance"] }

[lints]
workspace = true

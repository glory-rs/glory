[package]
repository.workspace = true
authors.workspace = true
name = "glory-wry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust semantic UI host with an IPC-driven system WebView"

[features]
default = []
css = ["glory-html/css"]
shell = ["dep:wry", "dep:tao"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-render = { path = "../render", version = "0.7.0" }
glory-html = { path = "../html", version = "0.7.0" }
glory-core = { path = "../core", version = "0.7.0" }
glory-ui = { path = "../ui", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
wry = { version = "=0.57.1", optional = true }
tao = { version = "=0.37.2", optional = true }

[lints]
workspace = true

[[test]]
name = "window"
path = "tests/window.rs"
harness = false
required-features = ["shell"]

[package]
name = "glory-routing"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned, renderer-independent routing and navigation for Glory"

[features]
default = []
widgets = ["dep:glory-ui", "dep:glory-render"]

[dependencies]
glory-core = { path = "../core", version = "0.6.1" }
glory-ui = { path = "../ui", version = "0.6.1", optional = true }
glory-render = { path = "../render", version = "0.6.1", optional = true }
url = "2.5.8"
percent-encoding = "2.3.2"

[dev-dependencies]
glory-ssr = { path = "../ssr", version = "0.6.1" }

[lints]
workspace = true

[package]
name = "glory-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owned incremental runtime for Glory semantic UI"
# Keep the runtime's integration tests and benches explicit.
autotests = false
autobenches = false

[dependencies]
glory-render = { path = "../render", version = "0.3.1" }

[[test]]
name = "runtime"
path = "tests/runtime.rs"

[[test]]
name = "queues"
path = "tests/queues.rs"

[[test]]
name = "resources"
path = "tests/resources.rs"

[[test]]
name = "fields"
path = "tests/fields.rs"

[[test]]
name = "entries"
path = "tests/entries.rs"

[[test]]
name = "collections"
path = "tests/collections.rs"

[[bench]]
name = "collections"
path = "benches/collections.rs"
harness = false

[lints]
workspace = true

[[test]]
name = 'graph_stats'
path = 'tests/graph_stats.rs'

[[bench]]
name = "graph"
path = "benches/graph.rs"
harness = false

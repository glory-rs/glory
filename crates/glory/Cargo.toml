[package]
repository.workspace = true
name = "glory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure Rust semantic UI with replaceable rendering hosts"
autotests = false

[features]
default = []
dsl = ["web", "dep:glory-view-macros"]
css = ["glory-style/css", "glory-html?/css", "glory-ssr?/css", "glory-apace?/css"]
html = ["dep:glory-html"]
web = ["html", "dep:glory-web"]
ssr = ["html", "dep:glory-ssr"]
hydrate = ["web", "glory-web/hydrate"]
resources = ["dep:glory-resource", "glory-web?/resources", "glory-ssr?/resources"]
i18n = ["dep:glory-i18n"]
routing = ["dep:glory-routing", "glory-routing/widgets", "glory-web?/routing", "glory-apace?/routing"]
stream = ["ssr", "resources", "glory-ssr/stream", "glory-web?/stream"]
apace = ["html", "dep:glory-apace"]
apace-package = ["apace", "glory-apace/package"]
apace-assets = ["apace", "glory-apace/assets"]
apace-network = ["apace", "glory-apace/network"]
apace-permissions = ["apace", "glory-apace/permissions"]
apace-clipboard = ["apace", "glory-apace/clipboard"]
apace-files = ["apace", "glory-apace/files"]
apace-android-assets = ["apace", "glory-apace/android-assets"]
apace-paint = ["apace", "glory-apace/paint"]
apace-raster = ["apace-paint", "glory-apace/raster"]
apace-shell = ["apace-paint", "glory-apace/shell"]
apace-android-native-activity = ["apace-shell", "glory-apace/android-native-activity"]
apace-android-game-activity = ["apace-shell", "glory-apace/android-game-activity"]
apace-accesskit = ["apace-shell", "glory-apace/accesskit"]

[dependencies]
glory-routing = { path = "../routing", version = "0.6.0", optional = true }
glory-view-macros = { path = "../view-macros", version = "0.6.0", optional = true }
glory-core = { path = "../core", version = "0.6.0" }
glory-ui = { path = "../ui", version = "0.6.0" }
glory-render = { path = "../render", version = "0.6.0" }
glory-style = { path = "../style", version = "0.6.0" }
glory-html = { path = "../html", version = "0.6.0", optional = true }
glory-web = { path = "../web", version = "0.6.0", optional = true }
glory-ssr = { path = "../ssr", version = "0.6.0", optional = true }
glory-resource = { path = "../resource", version = "0.6.0", optional = true }
glory-i18n = { path = "../i18n", version = "0.6.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-apace = { path = "../apace", version = "0.6.0", optional = true }

[lints]
workspace = true

[[test]]
name = "semantic_html"
path = "tests/semantic_html.rs"
required-features = ["ssr"]

[[test]]
name = "display_dsl"
path = "tests/display_dsl.rs"
required-features = ["dsl"]

[[example]]
name = "semantic_apace"
required-features = ["apace"]

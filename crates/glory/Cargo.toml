[package]
name = "glory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure Rust semantic UI with replaceable rendering hosts"
autotests = false

[features]
default = []
css = ["glory-style/css", "glory-html?/css", "glory-ssr?/css", "glory-blitz?/css"]
html = ["dep:glory-html"]
web = ["html", "dep:glory-web"]
ssr = ["html", "dep:glory-ssr"]
hydrate = ["web", "glory-web/hydrate"]
resources = ["dep:glory-resource", "glory-web?/resources", "glory-ssr?/resources"]
i18n = ["dep:glory-i18n"]
stream = ["ssr", "resources", "glory-ssr/stream", "glory-web?/stream"]
blitz = ["html", "dep:glory-blitz"]
blitz-package = ["blitz", "glory-blitz/package"]
blitz-assets = ["blitz", "glory-blitz/assets"]
blitz-paint = ["blitz", "glory-blitz/paint"]
blitz-raster = ["blitz-paint", "glory-blitz/raster"]
blitz-shell = ["blitz-paint", "glory-blitz/shell"]
blitz-android-native-activity = ["blitz-shell", "glory-blitz/android-native-activity"]
blitz-android-game-activity = ["blitz-shell", "glory-blitz/android-game-activity"]
blitz-accesskit = ["blitz-shell", "glory-blitz/accesskit"]

[dependencies]
glory-core = { path = "../core", version = "0.3.1" }
glory-ui = { path = "../ui", version = "0.3.1" }
glory-render = { path = "../render", version = "0.3.1" }
glory-style = { path = "../style", version = "0.3.1" }
glory-html = { path = "../html", version = "0.3.1", optional = true }
glory-web = { path = "../web", version = "0.3.1", optional = true }
glory-ssr = { path = "../ssr", version = "0.3.1", optional = true }
glory-resource = { path = "../resource", version = "0.3.1", optional = true }
glory-i18n = { path = "../i18n", version = "0.3.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glory-blitz = { path = "../blitz", version = "0.3.1", optional = true }

[lints]
workspace = true

[[test]]
name = "semantic_html"
path = "tests/semantic_html.rs"
required-features = ["ssr"]

[[example]]
name = "semantic_blitz"
required-features = ["blitz"]

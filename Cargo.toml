[workspace]
# Rebuild the semantic architecture without legacy feature aliases. Older
# adapter/tool sources rejoin once migrated; see docs/semantic-ui-implementation.md.
members = ["crates/style", "crates/render", "crates/core", "crates/resource", "crates/i18n", "crates/ui", "crates/html", "crates/web", "crates/ssr", "crates/blitz", "crates/glory"]
exclude = ["examples", "benchmarks"]
resolver = "2"

[workspace.package]
version = "0.3.1"
authors = ["Chrislearn Young <chris@acroidea.com>"]
edition = "2024"
# MSRV policy: track the highest minimum required by supported workspace
# dependencies. The retained Salvo 1.0 tool declaration requires Rust 1.94; bumping this value is a
# SemVer-minor change for Glory itself.
rust-version = "1.94"
description = """
Glory is an experimental rust web front framework.
"""
homepage = "https://glory.rs"
repository = "https://github.com/glory-rs/glory"
documentation = "https://docs.rs/glory/"
readme = "./README.md"
keywords = ["http", "async", "web", "framework", "server"]
license = "MIT OR Apache-2.0"
categories = [
  "web-programming::http-server",
  "web-programming::websocket",
  "network-programming",
  "asynchronous",
]

[workspace.dependencies]
glory-core = { version = "0.3.1", path = "crates/core", default-features = false }       #
glory-routing = { version = "0.3.1", path = "crates/routing", default-features = false }
glory-hot-reload = { version = "0.3.1", path = "crates/hot-reload" }
glory-macros = { version = "0.3.1", path = "crates/macros" }
glory-serverfn = { version = "0.3.1", path = "crates/serverfn", default-features = false }

anyhow = "1.0.104"
actix-web = "4.18.1"
actix-ws = "0.4.0"
async-trait = "0.1.92"
inventory = "0.3.25"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
axum = "0.8.9"
base64 = "0.23.1"
cfg-if = "1.0.5"
ciborium = "0.2.2"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
educe = "0.8.1"
form_urlencoded = "1.2.2"
futures = "0.3.34"
futures-channel = { version = "0.3.34", default-features = true }
getrandom = "0.4.3"
indexmap = "2.14.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
js-sys = "0.3.106"
multimap = "0.10.1"
once_cell = "1.21.4"
parking_lot = "0.13.0"
paste = "1.0.15"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", features = ["alloc"] }
path-slash = "0.2.1"
regex = "1.13.1"
salvo = { version = "1.0.1", default-features = true }
serde = { version = "1.0.229" }
serde_json = { version = "1.0.154" }
serde_urlencoded = "0.7.1"
smallvec = "1.16.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
# tracing-subscriber = "0.3"
url = "2.5.8"
wasm-bindgen = { version = "0.2.129", features = ["enable-interning"] }
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-test = "0.3.79"

# cli dependencies
ansi_term = "0.12.1"
brotli = { version = "9.1.0", features = ["default"] }
bytes = "1.12.1"
camino = "1.2.6"
cargo_metadata = { version = "0.23.1", features = ["builder"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
derive_more = { version = "2.1.1", features = ["display"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
dunce = "1.0.5"
flate2 = "1.1.10"
flexi_logger = "0.31.10"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.49.0", features = ["yaml"] }
itertools = "0.15.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["browserslist"] }
log = "0.4.34"
notify = "8.2.1"

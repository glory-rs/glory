[workspace]
# The supported semantic workspace; retired adapter/tool packages are removed.
# See docs/semantic-ui-implementation.md for implementation and platform scope.
members = ["crates/style", "crates/render", "crates/core", "crates/resource", "crates/i18n", "crates/routing", "crates/ui", "crates/html", "crates/web", "crates/ssr", "crates/apace", "crates/glory", "crates/salvo-adapter", "crates/view-macros"]
exclude = ["examples", "benchmarks", "tools/cli"]
resolver = "3"

[workspace.package]
version = "0.6.1"
authors = ["Chris Young <chris@veco.id>"]
edition = "2024"
# Minimum supported Rust version for the coordinated 0.6.1 development series.
rust-version = "1.95"
description = """
Glory is a Rust semantic UI framework with replaceable rendering hosts.
"""
homepage = "https://glory.taidge.org"
repository = "https://github.com/glory-rs/glory"
documentation = "https://docs.rs/glory/"
readme = "./README.md"
keywords = ["http", "async", "web", "framework", "server"]
license = "Apache-2.0"
categories = [
  "web-programming::http-server",
  "web-programming::websocket",
  "network-programming",
  "asynchronous",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
strip = "symbols"

[workspace.lints.rust]
# Glory's core does not need `unsafe`. The wasm-bindgen / web-sys path
# already routes through safe wrappers. Lift this to `forbid` once the
# generational-box redesign confirms it stays that way.
unsafe_code = "deny"
# We're on edition 2024; surface anything that would block a future
# edition upgrade so it shows up at PR time rather than years later.
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Pragmatic baseline: warn on everything in the standard clippy set,
# but don't fail the build. Individual crates can override per-lint.
all = { level = "warn", priority = -1 }
# These trigger on common builder-pattern code that's idiomatic in
# Glory; the noise outweighs the benefit.
needless_return = "allow"
new_without_default = "allow"
type_complexity = "allow"
# Closure-heavy callsites generate a lot of these on stable Rust.
needless_lifetimes = "allow"
too_many_arguments = "allow"

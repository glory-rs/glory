[package]
name = "scenario-glory"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
glory = { path = "../../../crates/glory", default-features = false, features = ["web"] }
wasm-bindgen = { version = "=0.2.129", features = ["enable-interning"] }
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element"] }

[workspace]

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[package]
name = "scenario-glory"
version = "0.0.0"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[dependencies]
glory = { path = "../../../crates/glory", default-features = false, features = ["web"] }
wasm-bindgen = { version = "=0.2.130", features = ["enable-interning"] }
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element"] }

[workspace]

resolver = "3"
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

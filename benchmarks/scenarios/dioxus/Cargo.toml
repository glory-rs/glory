[package]
name = "scenario-dioxus"
version = "0.0.0"
edition = "2024"
publish = false

rust-version = "1.95"

license = "Apache-2.0"

[features]
rows = []

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks"] }
wasm-bindgen = { version = "=0.2.130", features = ["enable-interning"] }

[workspace]

resolver = "3"
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

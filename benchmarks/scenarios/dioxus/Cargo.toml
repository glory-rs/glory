[package]
name = "scenario-dioxus"
version = "0.0.0"
edition = "2024"
publish = false

[features]
rows = []

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks"] }
wasm-bindgen = { version = "=0.2.129", features = ["enable-interning"] }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "bench-glory"
version = "0.0.0"
edition = "2024"
publish = false

[features]
handwritten = []
acceptance = []

[dependencies]
glory = { path = "../../crates/glory", default-features = false, features = ["dsl"] }
wasm-bindgen = { version = "=0.2.129", features = ["enable-interning"] }
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element"] }

[workspace]

[package.metadata.benchmark]
contract = "semantic-rows-v1"
display-profile = "html-display-keyed-v2"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

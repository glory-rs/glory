# The runtime requires sibling engine checkouts, which Dependabot cannot fetch.
# Keep its Cargo updater on the independent CLI workspace. Runtime dependencies
# remain covered by quality.yml's maintained-workspace RustSec audit.
# See docs/dependency-maintenance.md for the coordinated runtime update process.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/tools/cli"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

name: release
on:
  push:
    branches:
      - release
    paths:
      - "**/Cargo.toml"
      - ".github/workflows/release.yml"

jobs:
  git-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get releasing version
        working-directory: .
        run: echo NEXT_VERSION=$(sed -nE 's/^\s*version = "(.*?)"/\1/p' Cargo.toml) >> $GITHUB_ENV

      - name: Check published version
        run: echo PREV_VERSION=$(cargo search glory
         --limit 1 | sed -nE 's/^[^"]*"//; s/".*//1p' -) >> $GITHUB_ENV

      - name: Auto tag latest version
        uses: bullrich/commit-autotag@365442a73444d9b59ae92b051e19f4b4281f42fa # v1.0.1
        if: env.NEXT_VERSION != env.PREV_VERSION
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          strategy: regex
          root: Cargo.toml
          regex_pattern: "version\\s*=\\s*\"([0-9\\.]+)\""
          tag_prefix: "v"
          # version: "${{ env.NEXT_VERSION }}"

  publish:
    runs-on: ubuntu-latest
    needs: git-tag
    env:
      PUBLISH_PACKAGES: |
        glory-hot-reload|crates/hot-reload
        glory-macros|crates/macros
        glory-core|crates/core
        glory-routing|crates/routing
        glory-serverfn|crates/serverfn
        glory|crates/glory
        glory-cli|crates/cli
    steps:
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get workspace version
        run: echo NEXT_VERSION=$(sed -nE 's/^\s*version = "(.*?)"/\1/p' Cargo.toml) >> $GITHUB_ENV

      - name: Publish crates in dependency order
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          published_version() {
            local crate="$1"
            cargo search "$crate" --limit 20 \
              | awk -v crate="$crate" -F ' = "' '$1 == crate { split($2, version, "\""); print version[1]; exit }'
          }

          wait_for_version() {
            local crate="$1"
            local version="$2"

            for _ in {1..20}; do
              if [ "$(published_version "$crate" || true)" = "$version" ]; then
                return 0
              fi
              sleep 15
            done

            echo "::error::$crate $version was not visible in the crates.io index after publishing"
            return 1
          }

          logged_in=0
          while IFS='|' read -r crate path; do
            if [ -z "${crate// }" ]; then
              continue
            fi

            echo "::group::$crate"
            prev_version="$(published_version "$crate" || true)"
            echo "Releasing version: $NEXT_VERSION"
            echo "Published version: ${prev_version:-<none>}"

            if [ "$NEXT_VERSION" = "$prev_version" ]; then
              echo "$crate $NEXT_VERSION is already published; skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$logged_in" -eq 0 ]; then
              cargo login "$CRATES_TOKEN"
              logged_in=1
            fi

            echo "Cargo packaging $crate from $path..."
            cargo package -p "$crate"

            echo "Cargo publish dry-run for $crate..."
            cargo publish -p "$crate" --dry-run

            echo "Cargo publishing $crate..."
            cargo publish -p "$crate" --no-verify
            wait_for_version "$crate" "$NEXT_VERSION"
            echo "$crate $NEXT_VERSION has been published"
            echo "::endgroup::"
          done <<< "$PUBLISH_PACKAGES"

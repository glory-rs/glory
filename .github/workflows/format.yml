name: format
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out coordinated development engines
        shell: bash
        run: |
          if [ ! -d ../apace/.git ]; then git clone --filter=blob:none https://github.com/glory-rs/apace ../apace; fi
          if [ ! -d ../takia/.git ]; then git clone --filter=blob:none https://github.com/glory-rs/takia ../takia; fi
          if [ ! -d ../wingy/.git ]; then git clone --filter=blob:none https://github.com/glory-rs/wingy ../wingy; fi
      - name: Format current workspace and migrated examples
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_TARGET_DIR,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup default 1.98.0
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
          python scripts/library_lockfiles.py --manifest-path Cargo.toml --manifest-path tools/cli/Cargo.toml --manifest-path examples/counter/Cargo.toml --manifest-path examples/display-web/Cargo.toml --manifest-path examples/semantic-web/Cargo.toml --manifest-path examples/routing/Cargo.toml
          if ($LASTEXITCODE) { throw 'Library dependency resolution failed' }
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -or [IO.Path]::GetFullPath($meta.target_directory) -ne [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR)) { throw 'Unexpected Cargo target' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Workspace formatting failed' }
          python -m unittest discover -s scripts -p test_library_lockfiles.py
          if ($LASTEXITCODE) { throw 'Upstream dependency boundary failed' }
          foreach ($manifest in @('tools/cli/Cargo.toml','examples/counter/Cargo.toml','examples/display-web/Cargo.toml','examples/semantic-web/Cargo.toml','examples/routing/Cargo.toml')) {
            cargo fmt --manifest-path $manifest -- --check
            if ($LASTEXITCODE) { throw "Formatting failed: $manifest" }
          }
